<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Tích Biến Động Cổ Phiếu</title>
    <!-- Tải thư viện Plotly.js cho biểu đồ khoa học tương tác -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        /* Phong cách Minimalism & Glassmorphism cao cấp */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000; /* Dự phòng nếu video không tải được */
            color: #111;
            overflow: hidden; 
        }

        /* Lớp Video Background tĩnh/động phía sau */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.85; 
        }

        /* Bảng điều khiển hiệu ứng kính mờ sang trọng */
        .glass-container {
            position: relative;
            width: 85%;
            max-width: 1100px;
            margin: 4% auto;
            padding: 50px;
            background: rgba(255, 255, 255, 0.75); /* Trắng bán trong suốt */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px; /* Bo góc cực nhẹ để giữ nét tinh tế */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            height: 75vh;
            overflow-y: auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 300;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 13px;
            color: #666;
            letter-spacing: 1.5px;
        }

        /* Vùng chứa biểu đồ */
        #stockChart {
            width: 100%;
            height: 450px;
        }

        /* Tuỳ chỉnh thanh cuộn cho thanh lịch */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Thay đổi thuộc tính src thành link video nền hoặc ảnh nền dự án của bạn -->
    <video autoplay muted loop playsinline class="video-background">
        <source src="https://cdn.pixabay.com/video/2022/01/21/105047-668102607_tiny.mp4" type="video/mp4">
    </video>

    <div class="glass-container">
        <header>
            <h1>Phân Tích Xu Hướng Thị Trường</h1>
            <p class="subtitle">Dữ liệu tham chiếu: tập tin sv05.tsv | Cập nhật theo thời gian thực</p>
        </header>

        <!-- Biểu đồ sẽ được render tại đây -->
        <div id="stockChart"></div>
    </div>

    <script>
        // Dữ liệu mô phỏng. Khi triển khai thật, bạn có thể dùng d3.tsv() hoặc d3.csv() 
        // để đọc trực tiếp file sv05.tsv và bóc tách dữ liệu mảng x, y.
        var trace_close_price = {
            x: ['2026-09-01', '2026-09-05', '2026-09-10', '2026-09-15', '2026-09-20', '2026-09-25', '2026-10-01', '2026-10-05', '2026-10-10', '2026-10-15'],
            y: [102.5, 104.2, 101.8, 108.5, 110.1, 109.4, 115.0, 113.2, 118.6, 121.3],
            type: 'scatter',
            mode: 'lines',
            line: {
                color: '#222', // Đường nét màu xám đen quyền lực, không dùng màu chói
                width: 1.5,
                shape: 'spline' // Làm mượt các góc gấp khúc
            },
            fill: 'tozeroy', // Phủ gradient nhạt dưới đường xu hướng
            fillcolor: 'rgba(0,0,0,0.03)',
            name: 'Giá Đóng Cửa',
            hoverinfo: 'x+y'
        };

        var layout = {
            paper_bgcolor: 'rgba(0,0,0,0)', // Nền trong suốt để lộ hiệu ứng kính mờ
            plot_bgcolor: 'rgba(0,0,0,0)',
            margin: {t: 10, r: 20, l: 40, b: 40},
            xaxis: {
                showgrid: false, // Xoá lưới dọc rườm rà
                zeroline: false,
                showline: true,
                linecolor: '#ccc',
                tickfont: { family: 'Helvetica Neue', color: '#888' },
                spikemode: 'across', // Kích hoạt đường gióng crosshair
                spikesnap: 'cursor',
                showspikes: true,
                spikethickness: 1,
                spikedash: 'solid',
                spikecolor: '#555'
            },
            yaxis: {
                showgrid: true,
                gridcolor: 'rgba(0,0,0,0.04)', // Lưới ngang cực mờ
                zeroline: false,
                showline: false,
                tickfont: { family: 'Helvetica Neue', color: '#888' }
            },
            hovermode: 'x unified', // Tooltip gom chung thông số cực kỳ sang trọng
            hoverlabel: {
                bgcolor: 'rgba(255,255,255,0.95)',
                font: { family: 'Helvetica Neue', size: 13, color: '#111' },
                bordercolor: 'rgba(0,0,0,0.1)'
            }
        };

        var config = {
            displayModeBar: false, // Tắt toàn bộ các nút bấm zoom/pan mặc định để trang web sạch sẽ nhất
            responsive: true
        };

        // Khởi tạo biểu đồ
        Plotly.newPlot('stockChart', [trace_close_price], layout, config);
    </script>
</body>
</html>
